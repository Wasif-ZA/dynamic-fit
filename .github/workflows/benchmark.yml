name: Nightly benchmark

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-benchmark
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/fitsolver/constraints-ci.txt

jobs:
  benchmark:
    name: Nightly benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fitsolver
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            fitsolver/pyproject.toml
            fitsolver/constraints-ci.txt
      - name: Install solver
        run: python -m pip install -e "."
      - name: Run benchmark
        run: python bench/run.py --budget-ms 200 | tee benchmark-output.txt
      - name: Write run summary
        run: |
          {
            echo '```json'
            tail -n 1 bench/history.jsonl | python -m json.tool
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            fitsolver/benchmark-output.txt
            fitsolver/bench/history.jsonl
