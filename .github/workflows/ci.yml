name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/fitsolver/constraints-ci.txt

jobs:
  quality:
    name: CI quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fitsolver
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            fitsolver/pyproject.toml
            fitsolver/constraints-ci.txt
      - name: Install Ruff
        run: python -m pip install ruff==0.16.3
      - name: Lint
        run: python -m ruff check .

  tests:
    name: CI tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: fitsolver
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            fitsolver/pyproject.toml
            fitsolver/constraints-ci.txt
      - name: Install test environment
        run: python -m pip install -e ".[dev,api]"
      - name: Run tests
        run: |
          seed="$(python -c 'import os; print(int(os.environ["GITHUB_SHA"], 16) % (2**32))')"
          python -m pytest -c pyproject.toml --hypothesis-seed="$seed"

  contract:
    name: CI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            fitsolver/pyproject.toml
            fitsolver/constraints-ci.txt
      - name: Install contract tooling
        run: python -m pip install -e "./fitsolver[dev]"
      - name: Validate and build contract
        run: python contract/validate_fixtures.py --bundle
      - name: Upload contract artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            contract/request.schema.json
            contract/solution.schema.json
            contract/fixtures_request_example.json
            contract/fixtures.zip
            contract/contract-manifest.json
            contract/contract-*.zip
            contract/contract-*.zip.sha256

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [quality, tests, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every blocking job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
        run: |
          if [ "$QUALITY_RESULT" = success ] &&
             [ "$TESTS_RESULT" = success ] &&
             [ "$CONTRACT_RESULT" = success ]; then
            exit 0
          fi
          printf 'quality=%s tests=%s contract=%s\n' \
            "$QUALITY_RESULT" "$TESTS_RESULT" "$CONTRACT_RESULT"
          exit 1
